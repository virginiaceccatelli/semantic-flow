    \ by the label on the training split generalises to held-out programs, above the\
    \ token-identity floor; but the label axis is not the largest axis of variation\
    \ among the difference vectors, so the declared `sv1_ratio >= 2.0` criterion is\
    \ NOT met. The two statements are compatible and both are reported: the projection\
    \ asks whether the direction generalises, the concentration asks whether it dominates."
