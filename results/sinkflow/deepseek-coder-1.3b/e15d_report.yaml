consequence_for_e15c: E15-C's null becomes a claim about the MODELS. The identical
  readout detects a property these models verbalise and does not detect the security
  distinction, so 'not expressed in output-aligned coordinates' is now a supported
  statement rather than an unfalsifiable one.
