v3:
  verdict_text: "REDISTRIBUTION IN SIGN, NOT IN MEAN \u2014 a token-identical role's\
    \ share of the model's own answer shifts in the same direction in the large majority\
    \ of matched pairs, significantly under the exact null of that statistic; but\
    \ the shift is small and the delta distribution is heavy-tailed, so the MEAN's\
    \ permutation null does not fire. Read `median_delta_frac`, not `mean_delta_frac`,\
    \ and treat the magnitude as small."
  thresholds:
    sign_consistency: 0.7
    permutation_p: 0.05
    conservation_tolerance: 0.25
  checks:
    rules_installed_and_conserving: true
    redistribution_consistent: true
    above_permutation_control: false
    above_sign_test: true
    role_token_counts_matched: true
