# Experiment status registry — the single source of truth for what each
# experiment is currently claimed to show.
#
# This file is read by `scripts/90_make_paper_assets.py`, which skips
# `archived` experiments unless it is run with `--include-archived`. Archived
# experiments keep every raw CSV, figure and manifest they produced; what is
# retired is the *claim*, not the data, and every one of them is still
# reproducible from its stage command.
#
# status values
#   validated_foundation  a result the paper stands on; controls hold, the
#                         effect is above every floor, replicated across scale
#   supporting            real and reported, but it constrains rather than
#                         carries the argument (or it is instrument validation)
#   active                the current direction; being run now, not yet claimed
#   parked                built and partly run, then abandoned before any claim
#                         was made; the reason is recorded here and in
#                         docs/ARCHIVE.md. Code and data are kept and still run.
#   archived              the claim has been retired; data preserved, and the
#                         reason for retirement is recorded here
#
# See docs/RESULTS.md for what is currently supported and docs/ARCHIVE.md
# for the retired interpretation and why each piece of it was retired.

version: 3
updated: 2026-08-11

experiments:

  E1:
    name: lexical token type
    status: supporting
    stage: "20"
    tables: [static_probes_]
    claim: >
      Token-type identity is near-perfectly decodable at every layer. This is a
      machinery check: failure here means a pipeline bug, not a finding.

  E2:
    name: variable binding (lexical vs semantic identity)
    status: validated_foundation
    stage: "20"
    tables: [static_probes_]
    claim: >
      Which definition an identifier occurrence refers to is linearly decodable
      from mid-layer states, above a surface-shortcut floor pinned to 0.5 by
      construction on the context-matched stratum.
    why_foundation: >
      The context_matched stratum makes every surface feature uninformative by
      design (token-identical programs, one rebinding token, identical anchor
      windows and distances), and the effect survives it.

  E3:
    name: def-use edges (data flow)
    status: validated_foundation
    stage: "20"
    tables: [static_probes_]
    claim: >
      Directed def->use edges are linearly decodable, degrading with token
      distance, over the same surface floor as E2.

  E4:
    name: control dependence
    status: supporting
    central: false
    stage: "20"
    tables: [static_probes_]
    claim: >
      Control dependence is decodable at ceiling by mid layers — but its
      surface baseline is already 0.927, so the result mostly says the relation
      is locally syntactic. Reported as a contrast to E2/E3, not as a finding
      about representation.

  E5:
    name: context degradation
    status: supporting
    stage: "30"
    tables: [context_degradation_]
    claim: >
      Frozen E2/E3 probes survive long inert fillers and degrade under
      interference (competing updates, shadowing scopes) — distance alone is
      not what breaks the representation.

  E7:
    name: causal patching (raw)
    status: supporting
    central: false
    stage: "50"
    tables: [causal_patching_]
    claim: >
      Patching the clean run's residual state into the corrupted run moves the
      answer toward the clean answer at some (layer, position) cells.
      PRELIMINARY CAUSAL EVIDENCE ONLY.
    retired_claims:
      - >
        That it isolates *semantic use* of the taint relation. The sink_arg
        position is where the two programs' tokens differ, so patching it
        transports the surface difference as well as any semantic state; the
        design cannot separate the two. E11's coordinate swap exists to make
        that separation possible.

  E8:
    name: real-code generalization
    status: supporting
    stage: "10,20"
    tables: [static_probes_]
    claim: >
      E2/E3 probe accuracy transfers from synthetic programs to CodeSearchNet
      Python with the same layer signature.
    limitation: >
      Ground truth on real code comes from the same static analysis, and real
      functions have no context-matched stratum, so the surface floor there is
      not pinned to 0.5. The transfer number is therefore an upper bound on
      what transfers *semantically*.

  E9:
    name: obfuscation robustness
    status: supporting
    stage: "31"
    model: "deepseek-coder-1.3b, deepseek-coder-6.7b"
    tables: [obfuscation_robustness_]
    claim: >
      Frozen probes survive alpha-renaming and opaque predicates in the middle
      layers and collapse under control-flow flattening.
    note: >
      E9 is the COMPANION CONTROL for E15: same transformations, same models,
      binding and def-use instead of the security label. It is what separates
      "these transformations break linear readouts" from "security
      representations are specifically fragile". COMPLETE ON ALL THREE MODELS,
      and it settles the question in favour of the first: at each model's best
      layer, binding goes 1.000 -> 0.708-0.883 under renaming and 0.527-0.615
      under flattening, def-use -> 0.689-0.864 and 0.402-0.545, while E15's
      security readout holds 0.882-0.986 and 0.660-0.688. The security readout is
      AT LEAST AS ROBUST as the primitives it rests on, so no security-specific
      fragility claim is available - or needed.

  E10-0:
    name: J-lens implementation validation
    status: supporting
    stage: "60"
    tables: [jlens_validation_]
    claim: >
      The J-lens machinery is correct and transfers to code models: at the last
      decoder layer it reproduces the logit lens exactly (V1), and next-token
      recovery beats a norm-matched floor (V2).
    note: >
      This is instrument validation, and it is what E11 reuses. It is the only
      part of the E10 track that survives.

  E14:
    name: R-lens — a more faithful backward pass, and where it fails
    status: supporting
    stage: "110, and measured again inside 125"
    tables: [rlens_r2_, vocab_lens_diagnostics_]
    claim: >
      GATE R PASSES on both Llama-family models (stage 110). R0 forward invariance
      1.62e-06 (1.3b, float32) and 1.21e-03 (6.7b, float16) relative; R1
      last-layer identity cosine 1.0000 in both; R2 LRP beats raw autograd at 7/7
      and 9/9 testable layers; R2 conservation median |rho-1| = 0.0000 and 0.0001,
      i.e. rho within 1e-4 at EVERY layer including the embedding. E14's
      reference-architecture target reproduces on real models.
      THE RULE ABLATION REPLICATES, and settles §2.1 of the plan. Median |rho-1|
      with each rule removed: no_half 4.4203 / 4.4628, no_ln 0.9806 / 0.9885,
      no_attn 0.5128 / 0.3044, no_identity 0.2265 / 0.3941. The GATED-MLP SPLIT
      carries the faithfulness gain by ~4.5x, near-identically across a model
      twice the size and a different dtype. Attention - the one path left
      unmodified by design - costs 0.30-0.51, which is the bounded answer to what
      the unmodified softmax path costs.
      ONE RETRACTION: the August fp16 finding that the identity-rule made
      conservation WORSE does not replicate. In float32 the all-rules arm is
      0.0000 at every layer against 0.2265 without the identity rule, so the rule
      helps as designed and the earlier inversion was fp16 noise. Recorded in
      docs/design/E14_RLENS_PLAN.md.
      NOT APPLICABLE to starcoder2-3b: gate R cannot complete there. StarCoder2
      uses LayerNorm (deliberately unmatched - it subtracts the mean, so the
      rule's algebra differs) and a non-gated MLP (no gate_proj/up_proj/down_proj),
      so both homogenising rules bind to NOTHING and only the attention hooks
      register, which satisfies lrp_rules' own strict check. Stage 110 raises when
      its no_attn arm removes the only rule that bound. The tell is its
      rlens_r0_forward.csv reporting a forward delta of EXACTLY 0.0 - value-
      preserving rules still perturb float arithmetic, rules that never installed
      do not. The starcoder2-3b artifact labelled "rlens" in E15-C is therefore
      arithmetically a J-LENS and its 0.154 conservation is simply raw autograd.
      J0 now REFUSES this case (gate rlens_rules_bound, added 2026-08-19); it did
      not when those runs were made, which is why the artifact exists.
      Stage 111 (the trajectory experiment) is still not built.
    next_steps: >
      Stage 110 has now run on deepseek-coder-1.3b (float32), deepseek-coder-6.7b
      (float16) and starcoder2-3b (raises). AttnLRP is NOT the leverage: attention
      costs 0.30-0.51 while the gated-MLP rule carries 4.46. The open work is
      ARCHITECTURE GENERALITY - extending norm_eps_attr to LayerNorm and
      is_gated_mlp to non-gated MLPs, which is what would make the R-lens usable on
      starcoder2-3b at all. The LayerNorm half is the harder one: the
      mean-subtraction term is exactly what the current algebra assumes away.
      Stage 110 should also record a "not applicable" verdict for such
      architectures rather than raising. Full roadmap in docs/EXPERIMENTS.md.
    consequence: >
      The R-lens is not simply "better" and usable everywhere: it is
      architecture-dependent, and starcoder2-3b's R-lens numbers carry a fidelity
      caveat that no single-model claim should rest on, and E15-C's "three lenses
      agree" statement is for that model really two lenses measured three ways.
      J0 now REFUSES this case (gate rlens_rules_bound, added 2026-08-19); it did
      not when those runs were made, which is why the artifact exists. This is
      also the case study for why lens fidelity is a NON-BLOCKING DIAGNOSTIC
      rather than a gate
      - a gate would have silently excluded the model and the layers where the
      instrument is uncomfortable, which is exactly the selection an
      interpretability result must not make.
    note: >
      Representational track, observational only. E14 measures where the
      binding becomes readable in the model's OWN output basis, which the
      probes cannot say because they choose their own direction. It makes no
      causal claim — E13's interchange does that, and is strictly stronger for
      the purpose. Design and the four gates: docs/design/E14_RLENS_PLAN.md.

  E15:
    name: source-to-sink flow under obfuscation (the security audit track)
    status: validated_foundation
    stage: "120,121,122,123,124,125,126,127"
    model: "deepseek-coder-1.3b, deepseek-coder-6.7b, starcoder2-3b"
    tables: [sinkflow_clean_, sinkflow_obfuscation_, vocab_summary_,
             vocab_condition_similarity_, vocab_lens_agreement_,
             vocab_lens_diagnostics_, vocab_train_deltas_, vocab_controls_]
    headline: >
      CONTROL-FLOW FLATTENING ALONE ACCOUNTS FOR THE ENTIRE COLLAPSE OF A FROZEN
      SECURITY-FLOW READOUT, IN ALL THREE MODELS. Whether the value at a
      code-bearing sensitive argument is source-derived is decodable at 1.000 on
      held-out clean programs over TWO measured floors (a local +-3-token window
      at 0.431-0.521 and a whole-program lexical reader at 0.465-0.535). Applied
      ALONE, opaque predicates and mixed-boolean-arithmetic encoding cost exactly
      0.000; renaming costs 0.014-0.118; control-flow flattening costs
      0.312-0.340. The cumulative composition of all four costs 0.271-0.347 - so
      the INTERACTION (cumulative minus atomic) is +0.042 / -0.014 / +0.014,
      inside the measured draw-noise floor of 0.021 / 0.035 / 0.028. Composition
      adds nothing; one transformation carries the failure.
    question: >
      Does a code model represent whether the value reaching a code-bearing,
      security-sensitive argument is derived from untrusted input; which
      transformations break a readout of that fact ON THEIR OWN as opposed to
      through composition; and is the safe-to-unsafe difference expressed in the
      model's own output-aligned vocabulary?
    design: >
      3 sink families (command execution, SQL execution, dynamic code execution)
      x 4 flow structures (direct, assignment chain, branch/merge, one helper
      boundary) x 20 base seeds x 2 labels = 480 clean programs. Every base is a
      matched unsafe/safe pair holding the same source, propagation, trusted
      alternative and sink, differing ONLY at the sink argument. 14 of the 20
      seeds per cell train the readout; 6 are held out, and only those are
      transformed. TEN conditions: clean, normalize, four ATOMIC arms
      (rename_only, opaque_only, encode_only, flatten_only) and four CUMULATIVE
      ones (rename_cumulative, rename_opaque, rename_opaque_encode,
      rename_opaque_encode_flatten) = 1296 held-out variants, 1776 programs
      extracted per model. No new obfuscation algorithm and no arbitrary
      combinations: the atomic arms make the SAME four rewrites individually
      addressable. Each variant's transformations are read off its own AST and
      must equal exactly what its condition declares; both pair members share one
      draw; the transformed pair is re-checked for sink-argument confinement.
    numbers:
      site: sink_arg
      layer: "1.3b L11 (48%), 6.7b L15 (48%), starcoder2-3b L15 (52%) - matched
        RELATIVE depth, NOT a common index. In all three this is also the argmax
        of clean-training CV."
      n_heldout_per_condition: "144 programs / 72 bases; cluster bootstrap over bases"
      clean_heldout: "1.000 [1.000, 1.000] in all three models"
      atomic_rename_only: "1.3b 0.938 [0.889, 0.972] | 6.7b 0.986 [0.965, 1.000] |
        starcoder2-3b 0.882 [0.833, 0.931]"
      atomic_opaque_only: "1.000 / 1.000 / 1.000 - EXACTLY zero cost in every model"
      atomic_encode_only: "1.000 / 1.000 / 1.000 - EXACTLY zero cost in every model"
      atomic_flatten_only: "1.3b 0.688 [0.618, 0.750] | 6.7b 0.667 [0.597, 0.729] |
        starcoder2-3b 0.660 [0.583, 0.736]"
      cumulative_ladder: "rename_cumulative 0.958/0.951/0.910; rename_opaque
        0.944/0.965/0.931; rename_opaque_encode 0.951/0.965/0.938;
        rename_opaque_encode_flatten 0.729/0.653/0.674"
      interaction: "cumulative minus its atomic counterpart, for flattening:
        +0.042 / -0.014 / +0.014, against a DRAW-NOISE FLOOR of 0.021 / 0.035 /
        0.028 measured as rename_only vs rename_cumulative (identical
        transformation, independent draws). The interaction is not distinguishable
        from noise in any model."
      floors: "whole-program lexical 0.464 clean-train CV and 0.465-0.535 across
        all ten held-out conditions; local surface +-3 tokens 0.488-0.491 CV and
        0.431-0.521 held out; embedding layer 0.482 CV and 0.451-0.569 held out.
        No floor leaves chance anywhere."
      weakest_structure: "assign_chain under RENAMING ALONE, in all three models
        (0.778 / 0.972 / 0.639 vs branch_merge 1.000 / 1.000 / 1.000). Under
        flattening the helper boundary is worst for two of three (0.639 / 0.667 /
        0.556)."
      family_effect: "none that reproduces across models"
    failure_modes: >
      READ THIS BEFORE QUOTING ANY FLATTENING NUMBER. At flatten_only the
      per-class split is 0.625/0.750 (1.3b), 0.833/0.500 (6.7b) and 0.667/0.653
      (starcoder2-3b) on unsafe/safe, and 51% / 56% / 46% of matched pairs receive
      the SAME label. Under the full cumulative condition the class biases run in
      OPPOSITE directions across models - 6.7b toward "unsafe" (0.861/0.444),
      starcoder2-3b toward "safe" (0.569/0.778) - so residual accuracy is each
      model's own prior, not retained flow information. A constant predictor of
      either class scores exactly 0.500 on this balanced set. Dangerous errors
      appear BEFORE any structural change: starcoder2-3b under renaming alone is
      0.882 pooled but 0.764 on unsafe and 0.639 on assignment chains.
    e15c_vocabulary_contrast: >
      OBSERVATIONAL, AND A NULL. Mapping the same sink-site states into each
      model's own vocabulary space through three readouts (logit lens, J-lens,
      R-lens; R-lens declared primary in code before any result) finds NO stable
      security-vocabulary concept in any model. Held-out sign consistency of the
      security-lexicon contrast is 0.153 (1.3b), 0.403 (6.7b) and 0.694
      (starcoder2-3b) - not even directionally consistent, and 1.3b is
      significantly INVERTED (85% of pairs put less unsafe-pole mass on the unsafe
      member, p=0.000). Verdicts: inverted_security_vocabulary /
      stable_non_security_vocabulary / stable_non_security_vocabulary. The three
      lenses AGREE (pairwise cosine 0.75-0.97), so the null is not a lens
      artifact. What does replicate is semantically arbitrary vocabulary: frozen
      training-discovered tokens reappear in the held-out top-k at 0.875 / 0.750 /
      0.875 against 0.000 / 0.000 / 0.031 for random control tokens, but those
      tokens are " ?", "?.", "??" (1.3b), " liber", "clean", "tbl" (6.7b) and
      "OrNull", "displayMode", "fuchsia" (starcoder2-3b). It is NOT token
      identity: at the embedding layer the contrast is null (p = 0.81 / 0.80 /
      0.71) and 75% of pairs share the same anchor token at sink_arg. It is also
      NOT a distribution artifact: the contrast correlates with the paired
      difference in candidate-distribution entropy at r = -0.29 / +0.16 / +0.14
      and with the score-norm difference at -0.04 / -0.10 / +0.10, no cell exceeds
      |r| = 0.39, and the mean paired entropy difference is ~0 - at most 8% of the
      variance is distributional, so 1.3b's INVERTED sign is a real and currently
      unexplained property rather than a measurement error. Under
      flattening the vocabulary readout degrades with the probe (sign consistency
      0.389 / 0.472 / 0.583, p = 0.014 / 0.782 / 0.392), so BOTH trained and
      output-aligned auditability are lost together. THE CLAIM THIS LICENSES:
      linear decodability and expression in the model's own output vocabulary are
      different properties, and E15 exhibits the first without the second.
    controls:
      - "whole-program lexical baseline: token uni/bigrams plus char 3-5-grams
         over the ENTIRE program text, no hidden states, fitted on clean training
         programs only (vectorizer refitted per CV fold) and frozen through every
         condition. 0.465-0.535 in every condition and model. This is the floor
         the +-3-token window structurally cannot see, and it closes the
         'something with the whole text could do it' objection for TEXTUAL
         shortcuts - though not for a reader that runs the taint analysis itself"
      - "measured local surface baseline: +-3 token ids around the anchor, no
         hidden states, FROZEN and transferred through every condition. 0.431-0.521
         everywhere, so nothing reported here is the identifier - including under
         rename_only, where renaming destroys identifiers outright"
      - "the embedding layer (-1) at 0.482: token identity before any computation.
         NOTE it is ONE measurement, not three - the -1 predictions are
         byte-identical across models because the probe reduces to a lookup on the
         anchor token and the benchmark's fixed identifier pool induces the same
         partition under both tokenizers"
      - "draw-noise floor: rename_only and rename_cumulative apply the IDENTICAL
         transformation under independent draws, so their difference (0.021 /
         0.035 / 0.028) is the scale against which every interaction term is read"
      - "selectivity control (labels shuffled within each base) - but with two rows
         per base it can only SWAP them, so it understates the effect; do not quote
         it as the margin"
      - "which chain name is the tainted one alternates with the base index, so the
         anchor token identity is uninformative about the label corpus-wide"
      - "grouped CV by base: both members of a pair share a fold"
      - "E15-C additionally: permutation of the safe-to-unsafe orientation within
         bases, mismatched pairs drawn from different bases, the embedding layer,
         the last_token site (where both members carry the SAME token),
         identifier-role strata, and random and Gram-matched lens controls"
    companion_e9: >
      COMPLETE ON ALL THREE MODELS, and it settles the specificity question. The
      same transformations degrade BINDING and DEF-USE the same way: at each
      model's best layer, binding goes 1.000 -> 0.708-0.883 under renaming and
      0.527-0.615 under flattening; def-use goes 1.000 -> 0.689-0.864 and
      0.402-0.545. The security readout is at least as robust as the primitives it
      rests on (0.882-0.986 under renaming, 0.660-0.688 under flattening). The
      supported claim is therefore "structural obfuscation breaks frozen linear
      readouts of program relations, security ones included", NOT "security
      representations are specifically fragile".
    ground_truth: >
      Two independent readings must agree with each other and with every stored
      label: a flow-insensitive AST taint fixpoint written against call shapes (so
      it reads renamed and flattened variants), and instrumented execution under
      stubs with a provenance-carrying string. Every dangerous API is a recorder
      and the module runs with empty builtins, so no sink is ever executed. Each
      transformed variant's transformations are additionally read off its own AST
      and must equal exactly what its condition declares.
    gates:
      - "S0 (stage 120): PASS all three models - 480 clean programs, exact balance,
         no split leakage, every program parses, anchors token-exact, labels
         independently recovered, pairs differ only at the sink argument, and 1296
         variants over ten conditions each carrying exactly its declared
         transformation, both members under one draw, pair confinement re-checked"
      - "S1 (stage 121): PASS all three models - 1776 programs extracted per model
         (336 train + 144 held-out + 1296 variants), no skips, every anchor on a
         token boundary in the STORED encoding"
      - "S2 (stage 122): PASS all three models - fitted on 336 clean training
         programs; all four arms present (local_surface, whole_program_lexical,
         embedding, hidden_state); selectivity control run; the lexical
         vectorizer's provenance records clean-train-only fitting"
      - "S3 (stage 123): PASS all three models - 1600 rows (1.3b, 8 layers) / 1920
         rows (6.7b and starcoder2-3b, 10 layers), both classes and the per-class
         and matched-pair metrics in every reported cell, all ten conditions
         present, probe training bases disjoint from all 72 evaluated bases"
      - "J0 (stage 125): PASS all three models - 196 frozen candidate tokens, three
         lenses at every probed layer, forward logits unchanged under the LRP
         instrumentation, vocabulary rows and checkpoint consistent, nothing
         non-finite"
      - "J1 (stage 126): PASS all three models - 34560 pair rows (1.3b) / 43200
         (6.7b, starcoder2-3b), one matched member of each polarity per pair, one
         recorded orientation, discovery frozen to disk before held-out scoring,
         permutation and mismatched-pair controls run, every declared cell present"
      - "All six gates pass in every run with NO overrides recorded. J0 and J1 are
         mechanical only and passed on what turned out to be a NULL semantic
         result, which is what they were built to do. Lens fidelity is a
         DIAGNOSTIC that never blocks - see diagnostics below."
    diagnostics_not_gates: >
      R-lens relevance conservation is 1.0001 (1.3b) and 0.9993 (6.7b) - essentially
      exact - but 0.154 on starcoder2-3b, where the LRP rules NEVER INSTALLED
      (LayerNorm + non-gated MLP match neither homogenising rule), so that model's
      "rlens" artifact is arithmetically a J-lens. J0 now refuses this case. Agreement
      with the final-layer vocabulary distribution is 0.18-0.47 across lenses and
      models, below the 0.30 warning threshold in several cells. Next-token recovery
      is unmeasurable (n_eval = 0) because a 196-token candidate vocabulary rarely
      coincides with the true next token. None of this blocks: the experiment is
      mechanically valid and the report separates "mechanically invalid" from
      "mechanically valid with weak lens fidelity".
    limitation: >
      The floor is pinned only against DECLARED feature families. Two are now
      measured - a +-3-token window and a whole-program lexical reader - and both
      sit at chance, but a predictor that ran the taint analysis itself would still
      score 1.0, so this is an audit of a readout's transfer, not a
      construction-pinned representation claim of the E2 kind. The design evaluates
      four atomic and four cumulative conditions, NOT the full 15-arm lattice, so an
      interaction between two transformations without renaming is not measurable.
      "Flattening breaks the readout" is a claim about a FROZEN LINEAR readout at
      one site: a failing probe means the information is not linearly present at
      that position for that probe, not that the model lost it. The models were
      probed on different layer grids (8 layers for 1.3b, 10 for the other two);
      relative_depth is a column on every row and all cross-model numbers are read
      at matched depth. The embedding control is one measurement rather than three.
      E15-C is observational and its candidate pool is logit-lens-selected, so a
      direction only the J-lens or R-lens would surface, on a token outside the
      pool, could not be discovered. Security-lexicon coverage is model-specific
      (" vulnerable" survives on deepseek, " unsafe" on starcoder2-3b), which
      weakens the cross-model E15-C comparison. Synthetic Python, three sink
      families, four flow structures, a fixed non-adaptive threat model. Nothing
      causal is claimed or tested for the security property.
    status_note: >
      RUN at canonical scale on all three models with the atomic arms, the
      whole-program lexical baseline and the E15-C vocabulary contrast, all six
      gates passing with no overrides. Activation stores are not in the repository
      (results/activations/ is gitignored); everything downstream of them is. NOTE
      that these numbers supersede the earlier cumulative-ladder-only run: the
      benchmark was regenerated with the atomic conditions, which redraws every
      transformation, so figures moved (e.g. 1.3b's flattening result 0.632 ->
      0.729 for the cumulative condition). Do not mix the two generations.
  E15-D:
    name: the full-vocabulary direction, the positive control, and relevance routing
    status: validated_foundation
    stage: "128,129,130,131"
    tables: [align_summary_, align_loadings_, align_restricted_,
             relevance_summary_, relevance_conservation_]
    claim: >
      THE SAFE/UNSAFE DISTINCTION IS IN THE MODELS' OWN OUTPUT COORDINATES, AND
      IT IS NOT A WORD. Stage 128 forms each matched pair's difference over the
      WHOLE 32k vocabulary, freezes the mean direction on the training split, and
      projects held-out pairs onto it. On all three models, at mid depth and at
      the last_token site, 72/72 held-out pairs project POSITIVELY, mean cosine
      0.383 / 0.380 / 0.390 with cluster-bootstrap CIs [0.360,0.406],
      [0.358,0.401], [0.351,0.429]. A random direction in 32256 dimensions gives
      ~0.006, so this is roughly sixty standard deviations out. The
      token-identity floor is EXACTLY ZERO - at last_token both members carry the
      same token id, so all 72 embedding-layer differences vanish - and the
      same-label control sits at chance on the same direction (0.507 / 0.465 /
      0.549). On the 44 of 72 pairs with identical token counts the last-token
      position index is identical too, and 100% sign consistency over all 72
      entails 100% over those 44, so it is not a length or position effect.
      DEPTH: nothing at layers -1/0/3 (0.46-0.50), onset at layer 7, sustained
      0.96-1.00 from layer 11 to the output. One curve, two architecture
      families, three scales.
      OBFUSCATION: projection sign consistency 1.000 clean -> 0.889-0.986
      rename, 0.903-0.917 opaque, 0.972-1.000 encode, 0.681-0.819 FLATTEN,
      0.625-0.722 full cumulative; mean projection falls ~93% under flattening
      alone. This INDEPENDENTLY REPLICATES E15's headline with an unsupervised
      readout in which nothing is fitted.
      BUT IT IS NOT LEXICALISED: the top loadings are ' Lemmon', 'egraphics',
      'idir', 'women/son' CJK fragments, 'bootstrapcdn', '%%%%%%%%%%' - flat at
      0.019-0.027 across the top twelve, i.e. spread thinly over thousands of
      tokens. Output-aligned, distributed, and carried by no word for it.
    declared_criterion_that_failed: >
      sv1_ratio >= 2.0, declared in code before the run: the pairs' differences
      must concentrate on one direction at least twice as much as SAME-LABEL
      differences do. Measured 0.76 / 0.97 / 0.76 - FAILED ON ALL THREE. It fails
      because two programs of the same label already differ along a dominant
      shared axis of comparable size, so the label axis is not the largest axis
      of variation among the difference vectors. That is compatible with the
      projection result and both are reported: the projection asks whether a
      label-defined direction GENERALISES (yes, decisively), the concentration
      asks whether it DOMINATES (no). The verdict label is
      direction_replicates_but_not_dominant, and the two axes are shown to be
      different ones by the frozen direction's top-100 loadings overlapping the
      same-label direction's at a Jaccard index of 0.005 / 0.005 / 0.000.
    relevance_routing: >
      Stage 130, deepseek-coder-1.3b ONLY. Relevance conserves at median
      |rho-1| = 0.0000, worst case 5e-5, at every layer, so R_t/s is a genuine
      partition of the model's own answer and a paired difference is a
      redistribution. Aggregated by AST role; under the real tokenizer every
      token-identical role matches at 1.000 within every pair and sink_arg at
      0.611 (the 44/72 length-matched pairs), so a shift among the other roles is
      the model routing its answer through IDENTICAL TEXT. It shifts: whichever
      data-flow chain feeds the sink LOSES relevance share and the other GAINS.
      taint_chain 65/72 down and trust_chain 63/72 up at layer 0 (sign-test
      p = 7e-13 and 4e-11), holding at layer 3, decaying with depth, gone for
      taint_chain by layer 11 while trust_chain survives to layer 19. It holds
      separately in both role_swap strata and both order_swap strata at p <= 2e-2
      in all eight cells at layers 0 and 3, so it is neither an identifier-name
      nor a position-in-program effect. MAGNITUDE IS SMALL: median shift 1-2% of
      the answer. The pre-declared above_permutation_control check, which tests
      the MEAN, FAILS (p = 0.39-0.62): relevance deltas are heavy-tailed enough
      that seven outlier pairs of seventy-two flip the mean's sign while the
      median and the sign stay put. The statistic that survives is the sign, and
      its exact null under the same random-orientation scheme is binomial - which
      is the test quoted above. Verdict:
      redistribution_consistent_but_not_in_mean.
    positive_control: >
      THE READOUT IS NOT BLIND, AND THAT IS WHAT MAKES E15-C'S NULL MEAN
      SOMETHING. Stage 129 runs the IDENTICAL measurement - same pair_contrast
      call, same z-score convention, same orientation, one 102-token basis
      carrying both the yes/no poles and the E15-C security lexicon - on the
      E6/E7 forced-choice taint question. J3 passes on all three models.
      BEHAVIOUR: accuracy is 0.500 on every model, because each has a fixed
      answer bias whose argmax never moves - 1.3B answers "no" to every program
      (says_tainted_rate 0.000), 6.7B and starcoder2-3b answer "yes" to every
      program (1.000). The GRADED margin does separate the pair: pair_separation,
      the fraction of bases where the unsafe member draws a higher yes-margin
      than its matched safe counterpart, is 0.694 / 0.750 / 0.917 with sign-test
      p = 0.0013 / 0.0000 / 0.0000 under the `sink` prompt. Chance is 0.5 and no
      answer bias can move it, which is exactly why the design fixed on the
      paired statistic in advance.
      LENS: the readout finds it. Best taint cell 0.889 (1.3B L19) / 0.847
      (6.7B L27) / 0.944 (SC2 L29), permutation p = 0.000 on all three, tracking
      the model's own forced-choice margin at 0.708 / 0.806 / 0.917. Agreement
      with that margin rises monotonically with depth to 0.95 / 0.98 / 0.98 at
      the final layer, which it must because the lens IS the output head there -
      the internal validity check on the whole instrument, passed.
      SECURITY LEXICON AT THE SAME CELL: 0.347 (p=0.000) on 1.3B and 0.389
      (p=0.006) on starcoder2-3b, i.e. significantly INVERTED. Verdict
      machinery_validated on both: the identical readout detects a property these
      models express and does not detect the security lexicon, so E15-C'S NULL IS
      ABOUT THE MODELS AND NOT ABOUT THE INSTRUMENT.
      ONE ASYMMETRY, REPORTED AS SUCH: on deepseek-coder-6.7b the security
      lexicon ALSO fires at that cell (0.764, p=0.000), the
      both_properties_detected outcome. Read it narrowly - this is at the ANSWER
      POSITION of a prompt that asks the question, at 87% depth, not at the sink
      argument in unprompted code at mid depth where E15-C read. The two
      contrasts correlate only weakly (r = +0.26), so the security signal is not
      merely the taint signal renamed, but "vulnerable/safe" moving with
      "yes/no" where a model is about to answer a security question is close to
      expected. E15-C's null is a null about the UNPROMPTED state.
    prompt_sensitivity: >
      LARGE, AND MEASURING IT WAS NOT OPTIONAL. Both declared prompt styles ran.
      On deepseek-coder-6.7b they disagree outright: pair_separation is 0.750
      under `sink` and 0.222 under `e6` (p = 0.000 both ways), i.e. under the E6
      wording 78% of pairs give the SAFE member the higher yes-margin. Same
      model, same programs, opposite answer. 1.3B (0.694 vs 0.722) and
      starcoder2-3b (0.917 vs 0.806) agree across the two. Any behavioural claim
      resting on a single prompt is worth less than it looks.
    behaviour_under_obfuscation: >
      Pair separation under the `sink` prompt, clean -> flatten_only -> full
      cumulative: 0.694 -> 0.514 -> 0.472 (1.3B), 0.750 -> 0.597 -> 0.556 (6.7B),
      0.917 -> 0.694 -> 0.653 (starcoder2-3b). Flattening takes 1.3B to chance.
      This is the THIRD independent readout showing the same boundary - a fitted
      probe (E15), an unsupervised full-vocabulary direction (E15-D V1), and the
      model's own forced-choice margin - and the last involves no probe and no
      lens at all.
    not_run: >
      Stage 130 has not run on deepseek-coder-6.7b, so the relevance routing
      result is one model. Stage 130 is NOT APPLICABLE to starcoder2-3b and
      records J4 as such: LayerNorm plus a non-gated MLP means both homogenising
      LRP rules bind to nothing, so there is no conservation to read.
    corrects: >
      A DEFECT IN E15-C'S OWN CONTROLS, found while building this and fixed, now
      run on all three models. sinkflow_vocab.mismatched_pairs redraws the SAFE
      partner from the same safe pool, so the label difference survives it: its
      expected mean is the main arm's exactly, the two agree to four decimal
      places on the canonical runs, and on deepseek-coder-6.7b the control is
      MORE sign-consistent than the main arm (0.417 vs 0.403). It falsifies
      "specific to this pairing" and nothing more. The replacement same-label arm
      takes BOTH members from one pole. It behaves as designed and RETROACTIVELY
      STRENGTHENS E15-C: main mean contrast -0.304 / -0.200 / +0.094 against
      same-label +0.004,+0.015 / -0.031,+0.050 / +0.028,-0.004. The contrast
      collapses to nothing without the label, so 1.3B's inverted contrast is
      genuinely about the label rather than a program-to-program artifact.
      pairing_gain - what base matching buys - is 0.014 / 0.014 / 0.056.
      NO E15-C NUMBER CHANGED.
    next_steps: >
      1. Explain 6.7B's prompted security contrast - the one asymmetry left. The
      cheapest step reads the same cell under the `e6` prompt, which inverts that
      model's behaviour, from CSVs already on disk. 2. Run stage 130 on
      deepseek-coder-6.7b. 3. The direction's top loadings are uninterpretable
      and that is reported as a fact, not solved; whether the direction is
      causally used is untested and would need an intervention, which the E15
      extension's scope prohibits.

  E6:
    name: behavioral lead time
    status: archived
    stage: "40"
    tables: [behavioral_leadtime_, behavioral_sanity]
    retired_claims:
      - >
        That latent state corruption precedes behavioural failure. With a
        working behavioural signal and the analytic null in place, the excess
        early-warning rate is not distinguishable from what a readout's own
        error rate predicts, and a no-model position baseline scores higher
        than a 99%-accurate probe.
    reason: >
      The metric rewards unreliable readouts (r = -0.96 between early-warning
      rate and accuracy within readout families), so the raw rate cannot
      support a claim and the corrected version shows nothing.

  E10-2:
    name: taint workspace membership (J-lens)
    status: archived
    stage: "61"
    tables: [jlens_taint_]
    retired_claims:
      - >
        That the taint state is "verbalizable" and that its workspace
        membership explains E6's scale difference.
    reason: >
      Inherits E6's broken early-warning metric, and the underlying E6 effect
      it was built to explain did not survive its own floors. Null either way.

  E10-3:
    name: control dependence (J-lens)
    status: archived
    stage: "62,63"
    tables: [jlens_controldep_]
    retired_claims:
      - >
        That control dependence is decodable but "not verbalizable", i.e. a
        probe/lens dissociation.
    reason: >
      The positive controls at the same anchors were too weak to license
      reading the flat control_dep curve as a dissociation rather than a dead
      readout, and E4 — the result it was interrogating — is itself mostly a
      statement about local syntax.

  E13:
    name: binding interchange, falsified by the value assignment
    status: active
    stage: "100,101,102,103,104,105,106,107,108"
    model: deepseek-coder-6.7b
    tables:
      - results/binding/deepseek-coder-6.7b/interchange_summary.csv
      - results/binding/deepseek-coder-6.7b/interchange_contrasts.csv
      - results/binding/deepseek-coder-6.7b/e13_diagnosis.csv
    claim: >
      H0-H5 ALL PASS on deepseek-coder-6.7b. A rank-1, magnitude-free
      interchange at the use anchor (layer 8) makes the model emit the value
      the INSTALLED binding selects on 100.0% of held-out rows in BOTH value
      assignments — including the arm the subspace was never fitted on, where a
      token or answer-direction account demands the opposite movement. 280
      held-out base programs, 560 rows per cell, cluster bootstrap over bases.
      An answer-direction account is refuted rather than merely unsupported.
    caveat: >
      The closed-form difference-in-means baseline was run and it TRANSPORTS —
      76.1% / 76.8%, transfer ratio 1.003 — so a single fixed direction carries
      much of the binding. The learned direction dominates it: 100% at edit
      fraction 0.479 against 76% at 0.711, about twice the effect per unit dose,
      while capturing LESS of the raw state difference (59.5% vs 88.2%). It is
      therefore not a better-aligned mean. Report both arms. Still NOT
      demonstrated: why a rank-1 edit beats the whole-state patch (100% vs 86%);
      the available account (the full patch installs the driving component and
      components that fight it) is plausible and untested.
    identification: >
      A 2x2 of binding x value assignment. The same one-token binding flip
      demands OPPOSITE token movements in the two value assignments, so an
      alignment fitted on arm `ab` and tested on arm `ba` refutes an
      answer-direction account rather than assuming it away. E11 could not do
      this: with an arithmetic operation between the value and the answer it had
      to forbid answer == value to avoid circularity. Here the answer IS the
      bound value and the arm crossing breaks the circularity instead.
    why_not_e12: >
      E12 made two chained arithmetic steps the load-bearing capability for a
      question about program state, and failed its behavioural gate at 0.418 on
      1.3b — below chance, with the correct answer as argmax on 6.3% of prompts
      against a 10% uniform floor. Two of four families sat at exactly 0.500,
      which a no-computation numeric-proximity rule reproduces. E13 requires no
      arithmetic at all: the model returns a variable.
    gates:
      - "H0 (stage 101): execution and a SCOPE-AWARE reference interpreter agree; invariants hold, including the arm crossing"
      - "H1 (stage 102): the model returns the correctly bound variable — >= 0.85 overall AND >= 0.75 per cell"
      - "H2 (stage 104): which definition is in scope is decodable at the use anchor above the measured surface baseline"
      - "H3 (stage 105): whole-state interchange flips the answer in BOTH arms — the ceiling, and the proof that H5 is testable"
      - "H4 (stage 106): PASS — +9.029 [8.952, 9.108], 189% of the ceiling; all three control contrasts clear zero"
      - "H5 (stage 106): PASS — 100.0% of held-out rows emit the installed answer, 114% of that arm's ceiling; the answer_direction control transfers at an argmax ratio of 0.154 against transport's 1.025"
    gate_criterion_changed: >
      2026-08-13. H5's discriminator clause was moved from delta_ld to
      says_installed — the metric this module pre-registered in its design
      section and never implemented in any gate evaluator. delta_ld is
      positively biased at ceiling accuracy, so a disruptive edit lifts it with
      nothing transported. Under the old rule H5 read FAIL on that clause alone
      while its transfer condition passed at 188% of ceiling. Both readings, the
      full justification, and what would have made the change illegitimate are
      recorded in docs/ARCHIVE.md under 2026-08-13.
    numbers:
      site: use
      layer: 8
      rank: 1
      n_bases_test: 280
      says_installed_das: "ab 100.0%, ba 100.0% — at edit fraction 0.479"
      says_installed_whole_state: "ab 85.7%, ba 87.9% — at edit fraction 0.805"
      says_installed_mean_difference: "ab 76.1%, ba 76.8% — the closed-form baseline, at edit fraction 0.711"
      says_installed_random_norm: "ab 2.1%, ba 1.8% — at edit fraction 0.513 against the treatment's 0.479, i.e. an OVER-dosed control"
      says_installed_answer_direction: "ab 27.9%, ba 4.3% — 6.5x attenuation, the signature the design predicts for a token account"
      alignment_with_mean_difference: 0.673
      share_of_state_difference_captured: "das 0.595, mean_difference 0.882"
    status_note: >
      RUN on deepseek-coder-6.7b. All 14 machinery checks pass: structural zeros
      exactly 0.00e+00, alignment orthonormal to 4.07e-07, ceiling alive in both
      arms, and the model emits a non-candidate token on 0.0% of rows. Stage 108
      recomputes the summary and contrasts from the raw per-row `interchange.csv`
      rather than trusting the aggregates the GPU stage wrote — two separate
      aggregation bugs in the dose-matched control were caught this way, and both
      had made H4 fail on bookkeeping rather than on data.
    limitation: >
      H4 alone would be E11 again; the claim is H5, and it holds. The
      difference-in-means question is settled: the baseline transports at 76%
      and the learned direction beats it at two-thirds the dose. What is NOT
      established: why a rank-1 edit beats installing the whole donor state.
      Single model, single site, single layer, one binding construction — scope
      claims accordingly.

  E12:
    name: latent store transitions (INSTRUMENT VALIDATION)
    status: parked
    stage: "80,81,82,83,84,85,86,87,88,89"
    tables: []
    claim: >
      NONE. E12 claims no result and must not be written up as a finding.
      It is a check on the measuring apparatus, asking whether a computed,
      TEXT-ABSENT program value can be identified and interchanged such that
      downstream computation correctly transforms the installed value.
    why_not_a_finding: >
      Causal state interchange on a learned low-rank subspace is established
      method — DAS (arXiv:2303.02536), Othello-GPT (arXiv:2210.13382), and
      variable binding in symbolic programs (arXiv:2505.20896) all do a version
      of it. What this project owns that the field does not is the
      construction-pinned surface floor; combining that with a magnitude-free
      interchange is the contribution, and E12 builds only the instrument half.
      docs/design/E13_DIRECTIONS.md is what a pass licenses.
    status_note: >
      PARKED. The 1.3b pilot failed G1 at 0.4125 balanced accuracy on the test
      split — below chance — and the per-family breakdown is conclusive rather
      than merely negative. `add` (78 bases) and `double_sub` (45 bases) both
      returned cluster-bootstrap intervals of ZERO WIDTH at exactly 0.500. A
      bootstrap over dozens of bases cannot produce that by chance: it requires
      every base to take the identical value, which with two rows per base means
      exactly one variant is correct in every pair, which means the model
      answers BOTH programs of a pair the same way. The one-token mutation never
      reaches the output. A simulated responder that does no computation at all
      and merely picks the candidate numerically closer to the head literal
      reproduces the whole structure (overall 0.429 vs observed 0.4125; the same
      two families pinned at 0.500 with zero variance; one family near 0.22).
      The model is anchored on the head literal and never composes it through
      either statement, so this is not a chaining failure but a failure to do
      the first step. Correct answer as argmax on 6.3% of prompts against a 10%
      uniform-digit floor. The design coupled a question about
      program state to two-step arithmetic competence, which is the wrong
      bottleneck. Superseded by E13. Code, gates and the diagnostic are kept and
      still run. IMPLEMENTED, NOT RUN beyond the 1.3b behavioural gate. Stages
      80-89 are hard-gated: each refuses to run (exit 2) unless its prerequisite gates
      passed, and `--override-gate REASON` is recorded permanently in
      results/store/{model}/gates.yaml, in the manifest, and in every row.
    gates:
      - "G0 (stage 81): execution trace, reference interpreter and stored labels agree; invariants hold"
      - "G1 (stage 82): balanced accuracy >= 0.75 overall, >= 0.70 per retained operation family"
      - "G2 (stage 84): text-absent value decodes above the MEASURED lexical and control-task baselines"
      - "G3 (stage 85): frozen-decoder transfer is measurable, with a live text-present positive control"
      - "G4 (stage 86): whole-state interchange yields the TRANSFORMED state — ceiling and aliveness check"
      - "G5 (stage 87): low-rank interchange reaches >= 50% of the ceiling, clears six controls, transfers to a held-out operation"
    parts:
      - stage 80: token-aligned triples over a value absent from every program's text
      - stage 81: two independent readings of program state (GATE G0)
      - stage 82: behavioural capability (GATE G1)
      - stage 83: cached anchor activations
      - stage 84: decodability vs measured controls (GATE G2)
      - stage 85: natural state transitions (GATE G3)
      - stage 86: whole-state interchange ceiling (GATE G4)
      - stage 87: DAS-style low-rank interchange + controls (GATE G5)
      - stage 88: machine-readable gated report
      - stage 89: diagnostic for a failed gate (CPU triage; optional GPU prompt sweep)
    limitation: >
      G2 has no construction-pinned floor: the tracked value is a deterministic
      function of the visible text, so a baseline that can execute the program
      scores 1.0. It is reported against the measured lexical-window baseline as
      a PRECONDITION, never as a result.

  E11:
    name: J-space binding routing
    status: active
    verdict: >
      NO-GO under its own pre-registration, at BOTH positions. Reported in the
      paper because the failure is informative; not claimed as a positive
      result. behavioural_balanced_accuracy 0.706 vs a 0.75 threshold, and
      swap_is_specific_to_the_value_subspace FAILS (-0.016 [-0.024, -0.009] vs
      the plain logit lens). The use-position null is RETRACTED: the site's
      dose-response is 18x convex. See docs/ARCHIVE.md.
    stage: "70,71,72,73,74"
    tables: [jspace_lens_, jspace_readout_, jspace_behaviour_, jspace_swap_]
    question: >
      When a code model resolves variable binding, does it route the SELECTED
      value into J-lens coordinates that are causally reusable by downstream
      computation?
    parts:
      - stage 70: token-aligned counterfactual pairs, five operation families
      - stage 71: frozen per-layer J-lens from a held-out generic corpus (GATE)
      - stage 72: readout — paired counterfactual margin reversals
      - stage 73: causal coordinate swap with six controls
      - stage 74: pre-registered go/no-go for the full run
    status_note: >
      Run on 6.7b (1.3b failed the behavioural gate at 0.53 and is a capability
      result only). Two findings and one retraction, all in
      results/jspace/6.7b-5fam/ and reflected in paper/main.tex §5.
    findings:
      - >
        At the READOUT position (L24) the value-coordinate swap reaches 46% of
        the efficiency of an ideal same-norm push along the counterfactual
        direction, while two matched-norm controls reach zero (unrelated digits
        at matched separation -0.17; Gram-matched random 0.00). Positive in both
        operation families the model computes reliably (affine +0.554, modulus
        +0.171). The value is causally reused near the output.
      - >
        NOT attributable to the Jacobian correction. The plain logit lens is
        more efficient at the same site (2.35 vs 1.82), and at the last layer
        the two are equal by construction. E11's framing survives as a claim
        about output-aligned value directions, not about the J-lens.
    retracted:
      - >
        The use-position null. The dose-matched control (added 2026-08-07)
        shows the site's response to small edits is strongly convex: efficiency
        rises 18x from the smallest dose to the largest, and a push along the
        KNOWN-CORRECT direction at 2% of the norm yields 0.002 nats with an
        interval covering zero — the same as the value swap at 3.7%. No
        two-dimensional edit is large enough to test the question there, so
        "the value coordinates are causally inert at the marked use" is not
        supported. Without that control it would have been reported as a clean
        null with four passing subspace controls and a potent site.
    outstanding:
      - >
        The `probe_basis` control did not run: stage 72 was not re-run before
        stage 73, so no frozen probes were on disk and the variant was skipped.
        It is the readout-matched arm — the same swap in the basis of a probe
        that decodes the value from the same state (reversal 0.402 vs 0.025
        floor at the marked use).
