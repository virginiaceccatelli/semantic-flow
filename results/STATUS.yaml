    caveat: >
      The closed-form difference-in-means baseline was run in both models and it
      TRANSPORTS — 76.1% / 76.8% on 6.7b (transfer ratio 1.003) and 54.6% / 54.5%
      on starcoder2-3b — so a single fixed direction carries much of the binding.
      The learned direction dominates it in both: 100% at edit fraction 0.479
      against 76% at 0.711 (6.7b), and 100% at 0.478 against 55% at 0.717
