      says_installed_whole_state: "ab 85.7%, ba 87.9% — at edit fraction 0.805"
      says_installed_mean_difference: "ab 76.1%, ba 76.8% — the closed-form baseline, at edit fraction 0.711"
      says_installed_random_norm: "ab 2.1%, ba 1.8% — at edit fraction 0.513 against the treatment's 0.479, i.e. an OVER-dosed control"
      says_installed_answer_direction: "ab 27.9%, ba 4.3% — 6.5x attenuation, the signature the design predicts for a token account"
      alignment_with_mean_difference: 0.673
