    status_note: >
      RUN on deepseek-coder-6.7b and starcoder2-3b. On 6.7b all 14 machinery
      checks pass: structural zeros exactly 0.00e+00, alignment orthonormal to
      4.07e-07, ceiling alive in both arms, and the model emits a non-candidate
      token on 0.0% of rows. On starcoder2-3b 10 of 14 pass; the four failures are
      all structural-zero checks and are a THRESHOLD ARTIFACT, not a fault - see
      structural_zeros_starcoder below. Stage 108 recomputes the summary and
      contrasts from the raw per-row `interchange.csv` rather than trusting the
      aggregates the GPU stage wrote — two separate aggregation bugs in the
      dose-matched control were caught this way, and both had made H4 fail on
      bookkeeping rather than on data.
      BOOKKEEPING RESOLVED 2026-08-27: 6.7b's H5 gate and E13 report were
      regenerated from the unchanged measured rows under the says_installed
      evaluator and now record PASS. starcoder2-3b also records PASS. The
      superseded margin verdict remains documented in docs/ARCHIVE.md.
    structural_zeros_starcoder: >
      starcoder2-3b's four structural_zero checks report False and should not be
      read as a machinery fault. 58.6% of noop rows are EXACTLY zero and every
      non-zero one is a multiple of 0.03125 - one fp16 unit-in-last-place at that
      model's logit scale of ~36-38 - with a maximum of two ulps (6.25e-02) and a
      mean of +1.1e-05 whose interval straddles zero. verify_structural_zeros uses
      an ABSOLUTE 1e-4 bound, which is below what fp16 can represent here. The
      contrast that makes this legible: before the stage-106 layer-keying bug was
      fixed (2026-08-24) the same statistic was -0.129 [-0.141, -0.119] with a
      maximum of 0.719, i.e. systematically biased and 23 ulps wide. THAT was a
      fault; this is quantisation. The bound needs the same relative-tolerance
      treatment already applied to the conserving cotangent lens R0 check.
    the_stage_106_bug: >
      FIXED 2026-08-24, and it invalidated the FIRST starcoder2-3b run (2026-08-19,
      recorded H4/H5 as FAIL at 46% and 39%). scripts/106_binding_interchange.py
      assigned states_test, lens_vectors, mean_direction and fitted INSIDE the
      `for layer in layer_list` loop while resolving chosen_layer = layer_list[0]
      after it, so a MULTI-LAYER run evaluated the claim-bearing grid at the first
      layer using the LAST layer's states, cotangent lens and subspace. Invisible on any
      single-layer run, which is why 6.7b (layer 8 only, from H3) was never
      affected. The run with `--layers 7,11,15` put layer-15 states through a
      layer-7 intervention. Tells: noop at 7.19e-01, calibration says_installed
      1.000 collapsing to 0.239 on test at the identical cell, and
      mean_difference_L7/L11/L15.npy all on disk. The fix keys every per-layer
      object by layer and asserts the selected subspace's recorded layer equals
      chosen_layer.
    limitation: >
      H4 alone would be E11 again; the claim is H5, and it holds in both models.
      The difference-in-means question is settled: the closed-form baseline
      transports (76% on 6.7b, 55% on starcoder2-3b) and the learned direction
      beats it at roughly two-thirds the dose in both.
      WHAT IS NOT ESTABLISHED, and is now the largest loose end: why a rank-1 edit
      beats installing the whole donor state. 100% against 86% on 6.7b; 100%
      against 68.8% on starcoder2-3b, where in logit-margin terms the rank-1 edit
      reaches 434% of the whole-state ceiling. A gate expressed as a fraction of a
      ceiling the treatment exceeds four-fold has stopped doing work and should be
      reformulated before write-up. The available account - that the full patch
      installs the driving component AND components that fight it - remains
      plausible and undemonstrated.
      TWO MODELS ACROSS TWO ARCHITECTURE FAMILIES, single site, single layer, one
      binding construction — scope claims accordingly. The model count is no
      longer the limitation; the site and the construction are.

  E12:
    name: latent store transitions (INSTRUMENT VALIDATION)
    status: parked
    stage: "80,81,82,83,84,85,86,87,88,89"
    tables: []
    claim: >
      NONE. E12 claims no result and must not be written up as a finding.
      It is a check on the measuring apparatus, asking whether a computed,
      TEXT-ABSENT program value can be identified and interchanged such that
      downstream computation correctly transforms the installed value.
    why_not_a_finding: >
      Causal state interchange on a learned low-rank subspace is established
      method — DAS (arXiv:2303.02536), Othello-GPT (arXiv:2210.13382), and
      variable binding in symbolic programs (arXiv:2505.20896) all do a version
      of it. What this project owns that the field does not is the
      construction-pinned surface floor; combining that with a magnitude-free
      interchange is the contribution, and E12 builds only the instrument half.
      docs/RESULTS.md (open items) is what a pass licenses.
    status_note: >
      PARKED. The 1.3b pilot failed G1 at 0.4125 balanced accuracy on the test
      split — below chance — and the per-family breakdown is conclusive rather
      than merely negative. `add` (78 bases) and `double_sub` (45 bases) both
      returned cluster-bootstrap intervals of ZERO WIDTH at exactly 0.500. A
      bootstrap over dozens of bases cannot produce that by chance: it requires
      every base to take the identical value, which with two rows per base means
      exactly one variant is correct in every pair, which means the model
      answers BOTH programs of a pair the same way. The one-token mutation never
      reaches the output. A simulated responder that does no computation at all
      and merely picks the candidate numerically closer to the head literal
      reproduces the whole structure (overall 0.429 vs observed 0.4125; the same
      two families pinned at 0.500 with zero variance; one family near 0.22).
      The model is anchored on the head literal and never composes it through
      either statement, so this is not a chaining failure but a failure to do
      the first step. Correct answer as argmax on 6.3% of prompts against a 10%
      uniform-digit floor. The design coupled a question about
      program state to two-step arithmetic competence, which is the wrong
      bottleneck. Superseded by E13. Code, gates and the diagnostic are kept and
      still run. IMPLEMENTED, NOT RUN beyond the 1.3b behavioural gate. Stages
      80-89 are hard-gated: each refuses to run (exit 2) unless its prerequisite gates
      passed, and `--override-gate REASON` is recorded permanently in
      results/store/{model}/gates.yaml, in the manifest, and in every row.
    gates:
      - "G0 (stage 81): execution trace, reference interpreter and stored labels agree; invariants hold"
      - "G1 (stage 82): balanced accuracy >= 0.75 overall, >= 0.70 per retained operation family"
      - "G2 (stage 84): text-absent value decodes above the MEASURED lexical and control-task baselines"
      - "G3 (stage 85): frozen-decoder transfer is measurable, with a live text-present positive control"
      - "G4 (stage 86): whole-state interchange yields the TRANSFORMED state — ceiling and aliveness check"
      - "G5 (stage 87): low-rank interchange reaches >= 50% of the ceiling, clears six controls, transfers to a held-out operation"
    parts:
      - stage 80: token-aligned triples over a value absent from every program's text
      - stage 81: two independent readings of program state (GATE G0)
      - stage 82: behavioural capability (GATE G1)
      - stage 83: cached anchor activations
      - stage 84: decodability vs measured controls (GATE G2)
      - stage 85: natural state transitions (GATE G3)
      - stage 86: whole-state interchange ceiling (GATE G4)
      - stage 87: DAS-style low-rank interchange + controls (GATE G5)
      - stage 88: machine-readable gated report
      - stage 89: diagnostic for a failed gate (CPU triage; optional GPU prompt sweep)
    limitation: >
      G2 has no construction-pinned floor: the tracked value is a deterministic
      function of the visible text, so a baseline that can execute the program
      scores 1.0. It is reported against the measured lexical-window baseline as
      a PRECONDITION, never as a result.

  E11:
    name: cotangent-space binding routing
    status: active
    verdict: >
      NO-GO under its own pre-registration, at BOTH positions. Reported in the
      paper because the failure is informative; not claimed as a positive
      result. behavioural_balanced_accuracy 0.706 vs a 0.75 threshold, and
      swap_is_specific_to_the_value_subspace FAILS (-0.016 [-0.024, -0.009] vs
      the plain logit lens). The use-position null is RETRACTED: the site's
      dose-response is 18x convex. See docs/ARCHIVE.md.
    stage: "70,71,72,73,74"
    tables: [jspace_lens_, jspace_readout_, jspace_behaviour_, jspace_swap_]
    question: >
      When a code model resolves variable binding, does it route the SELECTED
      value into cotangent lens coordinates that are causally reusable by downstream
      computation?
    parts:
      - stage 70: token-aligned counterfactual pairs, five operation families
      - stage 71: frozen per-layer cotangent lens from a held-out generic corpus (GATE)
      - stage 72: readout — paired counterfactual margin reversals
      - stage 73: causal coordinate swap with six controls
      - stage 74: pre-registered go/no-go for the full run
    status_note: >
      Run on 6.7b (1.3b failed the behavioural gate at 0.53 and is a capability
      result only). Two findings and one retraction, all in
      results/jspace/6.7b-5fam/ and reflected in paper/main.tex §5.
    findings:
      - >
        At the READOUT position (L24) the value-coordinate swap reaches 46% of
        the efficiency of an ideal same-norm push along the counterfactual
        direction, while two matched-norm controls reach zero (unrelated digits
        at matched separation -0.17; Gram-matched random 0.00). Positive in both
        operation families the model computes reliably (affine +0.554, modulus
        +0.171). The value is causally reused near the output.
      - >
        NOT attributable to the Jacobian correction. The plain logit lens is
        more efficient at the same site (2.35 vs 1.82), and at the last layer
        the two are equal by construction. E11's framing survives as a claim
        about output-aligned value directions, not about the cotangent lens.
    retracted:
      - >
        The use-position null. The dose-matched control (added 2026-08-07)
        shows the site's response to small edits is strongly convex: efficiency
        rises 18x from the smallest dose to the largest, and a push along the
        KNOWN-CORRECT direction at 2% of the norm yields 0.002 nats with an
        interval covering zero — the same as the value swap at 3.7%. No
        two-dimensional edit is large enough to test the question there, so
        "the value coordinates are causally inert at the marked use" is not
        supported. Without that control it would have been reported as a clean
        null with four passing subspace controls and a potent site.
    outstanding:
      - >
        The `probe_basis` control did not run: stage 72 was not re-run before
        stage 73, so no frozen probes were on disk and the variant was skipped.
        It is the readout-matched arm — the same swap in the basis of a probe
        that decodes the value from the same state (reversal 0.402 vs 0.025
        floor at the marked use).

  E19:
    name: the PUBLISHED J-lens and R-lens on code models
    status: active
    stage: "200-205"
    tables: [workspace_lens_gate_, workspace_lens_summary_, workspace_lens_rows_,
             workspace_lens_ablation_]
    claim: >
      NO CLAIM YET. Implemented, unit-tested and validated on toy CPU models;
      the fitting run has not been executed, so no measurement exists. Any
      statement about what these lenses surface is pending
      results/workspace_lens/{model}/workspace_lens_report.md.
    method: >
      The estimator is the reference implementation released with "Verbalizable
      Representations Form a Global Workspace in Language Models" (2026),
      vendored unmodified at third_party/jacobian-lens (commit 581d398) and
      imported as `jlens`. The R-lens is that same estimator run under the
      published RelP backward rules (LN-rule, identity-rule, half-rule);
      attention, linear layers and q/k norms are unmodified, as published.
      Released recipe: target_layer = n_layers - 2, skip_first = 4,
      max_seq_len = 128, corpus NeelNanda/pile-10k, n = 100 prompts.
    not_this: >
      E19 is NOT E10/E14/E15-C/E16/E17/E18. Those use the repository's own
      cotangent lens (clens) and conserving cotangent lens (clrp): a
      corpus-averaged vector-Jacobian product against a FIXED CANDIDATE
      VOCABULARY, with the normalizer dropped, targeting the final layer and
      fitted on the task programs themselves. Different estimator, different
      target, different corpus, different readout. docs/WORKSPACE_LENS.md
      section 1 tabulates the differences. Their code, results and table labels
      were renamed on 2026-08-31 so the two can never be read as one method.
    compatibility:
      deepseek-coder-1.3b: >
        Fully compatible. LlamaRMSNorm + SiLU + gated SwiGLU, no biases, no q/k
        norms — the exact dense configuration of the released artifacts. All
        three published rules apply verbatim. Primary model (cheapest, and the
        one carrying the --halves repeatability arm).
      deepseek-coder-6.7b: >
        Fully compatible, same architecture as 1.3b. The expensive fit
        (~14 PFLOP/prompt); needs ~8 GB of HOST RAM for the fp32 Jacobian
        accumulators, which is the resource most easily under-requested.
      starcoder2-3b: >
        Supported with two documented adaptations: the LN-rule runs through a
        LayerNorm analogue (the published rule is stated for RMSNorm; the same
        denominator is detached and nothing else changes), and the half-rule is
        INAPPLICABLE because the MLP is not gated — recorded as "n/a", never
        "off". Biases throughout break exact relevance conservation, which is
        reported rather than corrected. This is strictly better than the
        archived clrp method managed here, where both homogenising rules bound
        to nothing and stage 140 refuses to run.
    gate: >
      Stage 202 runs seven checks (W1 corpus independence, W2 matched pair,
      W3/W3b readout correctness, W4 RelP forward invariance, W5 rules vs
      architecture, W6 build repeatability, W7 qualitative reproduction) and
      exits non-zero on a failed required one. Stages 203-205 are not
      interpretable until it passes; stage 205 reproduces the gate table at the
      top of its report so the two are never read apart.
