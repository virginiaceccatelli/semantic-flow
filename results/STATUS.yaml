      says_installed_answer_direction: "ab 44.8%, ba 18.4% — and its delta_ld goes NEGATIVE on ba (-0.263), i.e. the control reverses rather than merely attenuating"
      says_other_answer_direction: "10.9% of ab rows — that control partly destroys rather than redirects; the treatment's says_other is 0.0%"
      h4_fraction_of_ceiling: 4.34
