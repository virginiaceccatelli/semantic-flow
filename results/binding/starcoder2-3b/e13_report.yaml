experiment: E13
model: starcoder2-3b
verdict: NOT SUPPORTED
question: Does a low-rank, magnitude-free interchange at the site where a variable
  binding is resolved transport WHICH DEFINITION IS IN SCOPE, rather than a token
  or an answer direction?
identification: The same binding flip demands opposite token movements in the two
  value assignments. The alignment is fitted on arm `ab` and the claim is read on
  arm `ba`, where an answer direction is refuted rather than confounded.
do_not_claim:
- "that the model 'understands' scope \u2014 the claim is transport at one site"
- anything about real code, other languages, or other model families
- that H4 alone supports the conclusion; without H5 it is E11 again
- a null from H5 without checking that answer_direction failed on `ba` too
first_blocking_gate: H4
gates_run_under_override: []
gates:
- gate: H0
  meaning: 'the four-program factorial verifies: invariants, alignment, execution
    truth'
  owner_stage: 101_binding_verify
  recorded: true
  passed: true
  value: 1.0
  override: false
  detail: '1.0000 of 400 bases agree with an independent interpreter and satisfy every
    invariant, including the arm crossing that makes the held-out test a falsification
    (threshold 0.999). Per check: semantics_agree 1.0000, arms_crossed 1.0000, mutation_distance_ok
    1.0000, anchors_ordered 1.0000, values_distinct 1.0000, tokens_distinct 1.0000'
- gate: H1
  meaning: the model returns the correctly bound variable (behavioural accuracy)
  owner_stage: 102_binding_behaviour
  recorded: true
  passed: true
  value: 0.98125
  override: false
  detail: overall 0.981 [0.973, 0.988] against 0.85; weakest cell ab_target 0.954
    against 0.75
- gate: H2
  meaning: which definition is in scope is decodable at the use anchor
  owner_stage: 104_binding_decode
  recorded: true
  passed: true
  value: 1.0
  override: false
  detail: 'best layer 7: binding decodable at 1.000 (selectivity 0.519) against a
    MEASURED surface baseline of 0.500; margin +0.500. Thresholds 0.8 and 0.1. The
    floor is pinned by construction here: the anchor token is identical across the
    counterfactual and the mutation is outside the baseline''s window.'
- gate: H3
  meaning: "whole-state interchange flips the answer \u2014 the ceiling, per arm"
  owner_stage: 105_binding_ceiling
  recorded: true
  passed: true
  value: 1.745535714259105
  override: false
  detail: 'site use, layer 11 (both chosen on calibration): ab: +1.729 [+1.671, +1.788],
    flip rate 0.659; ba: +1.762 [+1.704, +1.820], flip rate 0.662 (thresholds: CI
    above 0.0, flip rate 0.25). Both arms must be measurable or an H5 null says nothing.'
- gate: H4
  meaning: low-rank interchange beats matched controls on the TRAINING arm
  owner_stage: 106_binding_interchange
  recorded: true
  passed: false
  value: 0.4573515159677648
  override: false
  detail: 'ab @ use L7 r1: +0.764 [+0.726, +0.800] = 46% of the whole-state ceiling
    +1.670 (threshold 50%); controls cleared: True; edit moved 0.433 of ||h||'
- gate: H5
  meaning: the same subspace transfers to the HELD-OUT value assignment, where an
    answer direction cannot
  owner_stage: 106_binding_interchange
  recorded: true
  passed: false
  value: 0.3861671469740634
  override: false
  detail: "ba @ use L7 r1: das_binding installed 23.9% = 39% of the held-out ceiling\
    \ (threshold 50%); margin +0.764 [+0.727, +0.800] = 45% of it; discriminator \u2014\
    \ answer_direction ab +0.919 [+0.813, +1.020], installed 32.5% (passes: True);\
    \ ba/ab argmax ratio 0.209 against transport's 1.012 (bar 0.506) (fails: True)"
diagnostic: interchange_contrasts.csv names the control that was not cleared. `random_norm`
  uncleared means any edit of that size does this; check edit_fraction_treatment against
  edit_fraction_control. Also read interchange_alignments.csv for convergence and
  orthogonality error.
rerun_after_fix: python scripts/106_binding_interchange.py --model starcoder2-3b --ranks
  1,2,4,8,16
