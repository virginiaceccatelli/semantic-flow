experiment: E18
model: deepseek-coder-6.7b
verdict: binding_associated_lexical_alignment
claim: >
  Several J-lens margins follow the binding counterfactual in both crossed value
  arms, ruling out simple tracking of literal answer token a or b. The single
  template confounds scope with position, distance, and replacement, so the
  result is not uniquely scope-semantic or faithful verbalisation.
mechanics:
  exactness_cells_passed: 1600
  word_pairs: 9
  held_out_bases_per_arm: 280
probe_accuracy: {L8: 1.0, L12: 1.0, L16: 1.0, L20: 1.0, L24: 1.0}
key_results:
  local_global:
    L16: {ab: 0.964, ba: 0.968}
    L20: {ab: 0.996, ba: 1.0}
    L24: {ab: 0.986, ba: 0.993}
  nested_module:
    L16: {ab: 1.0, ba: 1.0}
    L20: {ab: 0.964, ba: 0.982}
    L24: {ab: 0.993, ba: 0.996}
limitations:
  - one template jointly changes scope, order, distance, and replacement
  - lexical alignment is not proof of faithful verbalisation
  - independent-build sign agreement exceeds 0.90 only at L24
  - held-out lexical validation contains 13 positions
