experiment: E18
model: deepseek-coder-6.7b
verdict: not_verbalised
verdict_text: "The probe succeeds on these very states \u2014 binding is linearly present\
  \ at this position and layer, and E13/R10 shows it is causally used \u2014 while no predeclared\
  \ word pair is both strong and exceptional relative to Gram-matched directions in both value\
  \ arms at consecutive tested layers. Binding is REPRESENTED AND CAUSALLY USED BUT NOT DETECTABLY\
  \ VERBALISED in this lexicon at this position. Large raw reversals are not enough: matched\
  \ random directions produce them frequently too."
