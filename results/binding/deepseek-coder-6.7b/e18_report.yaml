do_not_claim:
- "that a null here shows the model cannot verbalise binding \u2014 it shows this lexicon,\
  \ at this position, under these three readouts, does not separate; E17 asks the prompted-behaviour\
  \ version of the question and answers it differently"
- "that a reversal here shows the model USES the word \u2014 a lens reading is a readout of\
  \ a state, it intervenes on nothing, and E13/R10's DAS interchange is the causal result"
- that the probe's accuracy is a J-lens result; it is the positive control, fitted in its
  own basis for its own label, and it is never expressed in word coordinates
- that a layer profile locates where binding is COMPUTED; it is where a fixed vocabulary contrast
  is readable
- anything about real code, other templates, other languages, or model families outside the
  ones the lens was built and validated on
