do_not_claim:
- "that a relevance shift shows the model USES the binding \u2014 this is an attribution\
  \ of the model's own score, it intervenes on nothing, and causal use is what E13/R10's\
  \ DAS interchange tests"
- that the size of a relevance shift is comparable to the size of a DAS effect; one
  is a share of an answer score, the other a rate of answer change under an edit
- "that the lens attributes relevance to pattern formation \u2014 the attn-rule detaches\
  \ q and k, so 'attend to the right definition' is precisely the mechanism this instrument\
  \ cannot see (src/models/lrp.py)"
- anything about real code, other languages, or model families outside the two DeepSeeks
  the R-lens rules match
- that answering the forced choice is INTROSPECTION. The question is about the program,
  and a model can answer it by reading the program at inference time exactly as a
  reader would. Nothing here distinguishes a report about the model's own computation
  from a correct answer about the text.
- "that a verbalisation null means the model lacks the concept. It means the concept\
  \ did not surface in these four question forms, at this readout position, in these\
  \ two choice words \u2014 R10 already shows the representation is there and is used."
- that the mechanism-vocabulary statistic is a contrast. It is a mass measurement
  against a random floor, it has no poles, and pooling it with the polar contrast
  would be adding a one-sided quantity to a two-sided one.
- that a word style scoring above chance generalises to the words it was not asked
  with. Four question forms and eight choice tokens is a sample of phrasings, not
  a coverage claim about how the model can be asked.
