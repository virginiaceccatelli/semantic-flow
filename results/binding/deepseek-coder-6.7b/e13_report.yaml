diagnostic: "The subspace did not transfer to the held-out value assignment. Read\
  \ the `answer_direction_jlens` rows FIRST \u2014 the published J-lens control, which\
  \ is H5's discriminator: if it also passes on `ba`, the discriminator is broken\
  \ and no verdict is licensed. If it fails on `ba` as designed and das_binding fails\
  \ too, the learned subspace is an answer direction \u2014 which is a real, reportable\
  \ negative and exactly what E11 could not establish. `answer_direction_rlens` is\
  \ the same diagnostic read through the published R-lens and is descriptive."
rerun_after_fix: "write it up \u2014 both outcomes are reportable; see docs/RESULTS.md\
  \ R13"
