experiment: E13
model: deepseek-coder-6.7b
verdict: "MACHINERY BROKEN \u2014 NO VERDICT"
question: Does a low-rank, magnitude-free interchange at the site where a variable
  binding is resolved transport WHICH DEFINITION IS IN SCOPE, rather than a token
  or an answer direction?
identification: The same binding flip demands opposite token movements in the two
  value assignments. The alignment is fitted on arm `ab` and the claim is read on
  arm `ba`, where an answer direction is refuted rather than confounded.
do_not_claim:
- "that the model 'understands' scope \u2014 the claim is transport at one site"
- anything about real code, other languages, or other model families
- that H4 alone supports the conclusion; without H5 it is E11 again
- a null from H5 without checking that answer_direction_jlens failed on `ba` too
- "that the R-lens arm gates anything \u2014 it is reported, never gated"
- "any number from the ARCHIVED `answer_direction` arm; it is a different estimator\
  \ (docs/WORKSPACE_LENS.md \xA71) and is not comparable"
first_blocking_gate: null
gates_run_under_override: []
superseded: null
structural_zeros_broken: "STRUCTURAL ZEROS FAILED \u2014 H3/noop: max |\u0394 logit-diff|\
  \ = 1.56e-02 over 19200 rows, against a tolerance of 1e-04; H3/pre_mutation_whole_state:\
  \ max |\u0394 logit-diff| = 3.12e-02 over 4800 rows, against a tolerance of 1e-04;\
  \ H5/noop: max |\u0394 logit-diff| = 2.50e-01 over 1360 rows, against a tolerance\
  \ of 1e-04; H5/pre_mutation_whole_state: max |\u0394 logit-diff| = 2.50e-01 over\
  \ 240 rows, against a tolerance of 1e-04. These are provable zeros: the no-op edit\
  \ is the zero vector and the pre-mutation site's host and donor are the same state,\
  \ so the model's output cannot move. Movement means the clean and patched log-probs\
  \ did not come from the same execution path (a float16 LM-head matmul is a different\
  \ kernel at a different batch shape, and one fp16 ulp at |logit| ~ 64 is 0.0625\
  \ \u2014 powers of two in this column are quantization, not transport), or the hooks,\
  \ anchors or dtypes are wrong. No claim from this run is licensed, including the\
  \ ones that look good."
