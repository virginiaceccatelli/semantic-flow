do_not_claim:
- "that a relevance shift shows the model USES the binding \u2014 this is an attribution\
  \ of the model's own score, it intervenes on nothing, and causal use is what E13/R10's\
  \ DAS interchange tests"
- that the size of a relevance shift is comparable to the size of a DAS effect; one
  is a share of an answer score, the other a rate of answer change under an edit
- "that the lens attributes relevance to pattern formation \u2014 the attn-rule detaches\
  \ q and k, so 'attend to the right definition' is precisely the mechanism this instrument\
  \ cannot see (src/models/lrp.py)"
- anything about real code, other languages, or model families outside the two DeepSeeks
  the R-lens rules match
- a layer profile as a claim about where binding is COMPUTED; it is where the answer's
  attribution is redistributed
