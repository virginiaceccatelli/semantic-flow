experiment: E16
model: deepseek-coder-1.3b
verdict: output_token_artifact
verdict_text: A shift is present but the two arms disagree in sign, which is the signature
  of an artifact of which output token the relevance was taken for rather than of
  the binding. The fixed_a/fixed_b conditions are the rows to read next.
observational: true
causal_benchmark:
  experiment: E13 / R10 (stage 106, DAS interchange)
  layer: null
  note: different quantity, not a different measurement of one quantity; no ratio
    between the two is computed
gates:
  H0:
    passed: true
    detail: '1.0000 of 200 bases agree with an independent interpreter and satisfy
      every invariant, including the arm crossing that makes the held-out test a falsification
      (threshold 0.999). Per check: semantics_agree 1.0000, arms_crossed 1.0000, mutation_distance_ok
      1.0000, anchors_ordered 1.0000, values_distinct 1.0000, tokens_distinct 1.0000'
  H1:
    passed: false
    detail: overall 0.809 [0.779, 0.838] against 0.85; weakest cell ab_target 0.571
      against 0.75
  H6:
    passed: true
    detail: '9600 readings and 19200 paired contrasts over 4 contrasts x 6 layers
      x 4 target conditions; median |rho-1| 1.56e-07; conserving layers [0, 3, 7,
      11, 15, 19]; LRP rules bound {''ln'': 49, ''mlp'': 24, ''attn'': 24}'
gates_not_run:
- H2
- H3
- H4
- H5
- H7
- H8
- H9
reported:
  layer: 7
  selection_source: calibration
  statistic: binding_shift_identical
  target_condition: bound
  contrast: flip_ab
  split: test
thresholds:
  sign_consistency: 0.7
  permutation_p: 0.05
  conservation_tolerance: 0.25
checks:
  rules_installed_and_conserving: true
  shift_consistent: true
  above_permutation_control: false
  above_sign_test: true
  arms_agree: false
  same_binding_controls_quiet: true
  statistic_is_token_identical: true
conserving_layers:
- 0
- 3
- 7
- 11
- 15
- 19
roles:
- inner_def_name
- inner_def_value
- outer_def_name
- outer_def_value
- use_site
- return_kw
- signature
- suffix
- other
token_identical_roles:
- inner_def_value
- outer_def_name
- outer_def_value
- use_site
- return_kw
- signature
- suffix
- other
shifts:
  binding_shift:
  - inner_def
  - outer_def
  binding_shift_identical:
  - inner_def_identical
  - outer_def
contrasts:
- name: flip_ab
  kind: binding_flip
  expect: shift
  binding_changes: true
  note: outer binding -> inner binding; bound value v_a -> v_b; exactly one token
    differs (the inner definition's name)
- name: flip_ba
  kind: binding_flip
  expect: shift
  binding_changes: true
  note: 'the SAME binding flip with the value assignment swapped: bound value v_b
    -> v_a. An output-token artifact must reverse sign here; a binding effect must
    not.'
- name: same_outer
  kind: same_binding
  expect: no_shift
  binding_changes: false
  note: binding fixed at OUTER; bound value v_a -> v_b as in flip_ab. Two tokens differ
    (both value literals), so the def-value roles are not token-identical in this
    control.
- name: same_inner
  kind: same_binding
  expect: no_shift
  binding_changes: false
  note: binding fixed at INNER; bound value v_a -> v_b as in flip_ab. Two tokens differ
    (both value literals).
