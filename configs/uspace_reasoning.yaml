# Stage 292: the upstream U-Space pipeline (third_party/u-space-pipeline, pinned commit)
# on CRUXEval / MBPP execution prediction. Read by upstream's src/config.py, so relative
# paths resolve against the upstream checkout; data_dir points back into this repository.
data_dir: ../../results/uspace_reasoning

items:
  n: 100000          # larger than both pools: every execution-verified call is used
  seed: 42

datasets:
  cruxeval:
    prepared: results/execution_uncertainty/prepared/cruxeval   # stage 290, relative to this repo
  mbpp:
    prepared: results/execution_uncertainty/prepared/mbpp

uspace_terms: data/uspace_terms.yaml

generation:
  seeds: [41, 42, 43]
  prompt_headroom: 4096

# Model entries copied verbatim from upstream configs/smoke.yaml (qwen4b) and
# configs/reproduce.yaml (magistral, qwen, gemma).
