# Experiment configuration — mirrors the stage CLI defaults so a run is fully
# described by (this file, configs/models.yaml, the stage manifests).
# The CLIs take precedence; this file documents the canonical settings.

global:
  seed: 42
  dev_model: deepseek-coder-1.3b       # local/MPS smoke + first full pass
  main_model: deepseek-coder-6.7b      # cluster main-results model
  replication_model: starcoder2-3b     # optional architecture replication

stage00_data:
  core:            {n_binding: 200, n_taint: 200, n_shadow: 100}
  context:         {n_bases: 40, filler_sizes: [0, 50, 100, 200, 500, 1000],
                    filler_types: [comment_prose, dead_code, lexical_decoy,
                                   competing_update, scope_shadow]}
  minimal_pairs:   {n: 40}             # only length-matched pairs are kept
  obfuscation:     {n_bases: 40, levels: [normalize, rename, opaque, encode, flatten]}
                                       # cumulative ladder; every variant execution-verified
  real:            {n: 200, source: code_search_net/python, split: validation}

stage10_extract:
  max_length: 1024                     # 2048 for context.jsonl
  dtype: float16
  layers: registry                     # ModelConfig.probe_layers per model

stage20_probes:                        # E1-E4 (+E8 on the real store)
  tasks: [lexical_token_type, binding, defuse_edge, control_dep, taint_state]
  probe: linear                        # linear only, by design
  C: 0.1
  max_iter: 2000
  tol: 1.0e-3
  cv_folds: 5
  max_samples: 20000                   # per (task, layer), group-level cap
  selectivity_control: true            # labels shuffled within source example
  negative_strata: [same_name_diff_binding, diff_name, distance_matched]

stage30_context:                       # E5
  tasks: [binding, defuse_edge]
  probes: frozen_from_stage20          # never retrained on variants

stage31_obfuscation:                   # E9
  tasks: [binding, defuse_edge]
  probes: frozen_from_stage20          # never retrained on variants

stage40_leadtime:                      # E6
  n_examples: 100
  calib_frac: 0.3                      # examples used only for threshold calibration
  layer: auto                          # best taint_state selectivity from stage 20

stage50_patching:                      # E7
  max_pairs: 100
  positions: [sink_arg, sanitizer_def, last_token]
  recovery_threshold: 0.5              # encoded_and_used cutoff on logit-diff recovery

# ── E10: J-lens (see docs/METHODS.md §6) ──────────────────────────────
# Stage 60 is a GATE: it exits non-zero on a failed required check, and
# stages 61/62 are not interpretable until it passes.

stage60_jlens_validate:                # E10 Phase 0 + Phase 1
  n_build: 60                          # positions used to build each lens
  n_eval: 60                           # held-out positions used to score it
  n_sources: 60                        # programs for the next-token check (V2)
  n_taint: 40                          # taint programs for the disposition check (V3)
  candidates: SAFE_NAMES               # single-token identifiers only, space-prefixed
  grad_scale: 1024.0                   # loss scaling so fp16 backward passes survive
  dtype: float16                       # float32 if check 0.3 reports non-finite grads
  required_checks: [0.1, 0.2, 0.3, 0.4, V1, V2_beats_random_floor,
                    V3_disposition_beats_random, V3_last_layer_matches_model]

stage61_jlens_taint:                   # E10-2 — priority experiment (explains E6)
  n_examples: 100
  calib_frac: 0.3                      # split used to BUILD lenses and calibrate
  candidates: [" yes", " no"]          # forced-choice answer tokens, as in E6/E7
  readouts: [jlens, logit, random, probe]
  probes: frozen_from_stage20          # optional; enables the probe comparison

stage62_jlens_controldep:              # E10-3 — probes E4's surface-heaviness
  n_examples: 120
  n_build: 30                          # programs used to build the lens
  n_tprime: 2                          # readout positions sampled after each guard
  candidates: SAFE_NAMES
  strata: [indent_matched, non_dependent]   # indent_matched is the hard control

# ── E11: J-space binding routing (the active direction) ──────────────────────
# Question: when the model resolves variable binding, does it route the
# SELECTED value into J-lens coordinates that downstream computation can
# causally reuse? Stage 71 is a GATE for 72/73.
#
# Separation contract, enforced in code (`counterfactual_pairs.assert_disjoint`):
#   lens-building corpus  real third-party Python, no generated program
#   calibration split     whole base programs, assigned in stage 70
#   test split            the rest; layer and site are chosen on calibration

stage70_jspace_pairs:
  n_bases: 120                         # each base yields one pair per family
  families: [affine, mul_sub, threshold, modulus, index]
  templates: [global_shadow, call_frame, padded_shadow]
  min_families: 2                      # a base must support the cross-op test
  calib_frac: 0.3                      # stratified by template, whole bases move
  answer_format: "assert f() =="       # answers are single tokens, verified
  invariants: [one_token_mutation, same_token_length, shared_positions,
               both_values_in_both_programs, answers_disjoint_from_values,
               execution_verified]

stage71_jspace_lens:                   # frozen instrument — GATE
  corpus: data/real/csn_python_200.jsonl     # generic Python, never the pairs
  n_corpus: 120
  n_build: 200                         # (program, t, t') triples per seed
  n_tprime: 3                          # future readout positions per source
  n_seeds: 3                           # independent builds for the stability check
  n_eval: 120                          # held-out positions for V2
  candidates: digits + values/answers in the pair file
  required_checks: [V1_last_layer_equals_logit_lens,
                    V2_beats_gram_matched_floor,
                    lens_stable_across_seeds]
  min_sign_agreement: 0.90             # margin-sign agreement across seeds

stage72_jspace_readout:                # is the bound value legible?
  positions: [pre_def, def_source, def_target, mutation, use, answer]
  readouts: [jlens, logit, gram_random, probe]
  headline_metric: paired counterfactual margin reversal
  n_boot: 2000                         # cluster bootstrap, grouped by base program
  probe_trained_on: calibration split only
  probe_label: bound value (multiclass)
  # Two settings changed on 2026-08-06, after the first two pilots, because
  # both were wrong rather than merely suboptimal. Recorded here so the earlier
  # runs stay interpretable; both old behaviours are still reachable.
  #   probe_label was `variant` (binds inner definition, yes/no). A variant
  #     classifier scores 1.000 by reading the one mutated token, which 6.7b
  #     confirmed — perfect at every layer, including at the mutation position
  #     where nothing is resolved. It measured the surface cue, not the binding.
  #   select_metric was `paired_gap`, a raw margin difference. Margins are not
  #     comparable across layers (see the scale caveat in src/models/lens.py),
  #     so it drifted to the last layer on both pilots — the one layer where the
  #     J-lens equals the logit lens by construction.
  select_metric: reversal_rate         # scale-free; --select-metric paired_gap restores the old choice
  reversal_floor: measured             # the gram_random cell, never the nominal 0.25

stage73_jspace_swap:                   # are those coordinates causally reused?
  positions: [use, pre_def]            # pre_def is the irrelevant-position control
  variants: [jlens_value, logit_value, gram_random, noop_same_value,
             jlens_answer, whole_state]
  band_width: 3                        # consecutive PROBED layers, not decoder layers
  metric: delta logP(other answer) - logP(bound answer), paired with the clean run
  key_test: same value swap must move each operation family to ITS own answer

stage74_jspace_report:                 # pilot go/no-go
  min_balanced_accuracy: 0.75
  min_readout_advantage: 0.0           # paired CI lower bound over gram_random
  min_swap_shift: 0.0                  # paired CI lower bound on the logit shift

pilot:                                 # the pre-registered 1.3b pilot
  model: deepseek-coder-1.3b
  n_bases: 100
  families: [affine, threshold]        # 200 pairs
  layers: [6, 12, 18, 23]

# ── E12: latent store transitions — INSTRUMENT VALIDATION ────────────────────
# Not a research contribution. Causal state interchange is established method
# (DAS, Othello-GPT, variable-binding work); E12 asks only whether THIS
# apparatus can identify and interchange a computed, TEXT-ABSENT program value
# such that downstream computation transforms it. Design: docs/ARCHIVE.md §1.4.
# What a pass would license: docs/RESULTS.md (open items).
#
# Stages 80-88 are hard-gated. Each declares its prerequisites in
# src/experiments/store_gates.py::STAGE_REQUIREMENTS and REFUSES to run (exit 2)
# unless they passed. `--override-gate REASON` is permitted and is recorded in
# results/store/{model}/gates.yaml, in the manifest, and in every output row.

stage80_store_pairs:                   # G0 data (gate recorded by stage 81)
  n_bases: 400                         # E11's 42 test bases were too few
  families: [add, sub_from, double_sub, mod]
  min_families: 3                      # 2 for the cross-op test + 1 to hold out
  calib_frac: 0.3                      # whole BASES move; split stored in the file
  invariants: [one_token_mutation, equal_token_length, shared_anchors,
               intermediate_absent_from_all_text, answers_disjoint,
               trichotomy_pairwise_distinct, mutation_far_from_injection_site,
               single_token_values, answer_appends_one_token]

stage81_store_verify:                  # G0 — records the gate
  readings: [execution_trace, reference_interpreter, stored_labels]
  min_verified_fraction: 0.999         # a few percent bad = a generator bug

stage82_store_behaviour:               # G1
  metric: balanced accuracy on a two-alternative forced choice
  min_overall_balanced_accuracy: 0.75
  min_family_accuracy: 0.70            # failing families are RETAINED in the CSV
  min_retained_families: 2

stage83_store_extract:                 # no gate; requires G0,G1
  anchors: [pre_def, mid_def, out_def, answer]
  variants: [base, counter, irrelevant]
  dtype: float16                       # storage dtype for the cached anchors

stage84_store_decode:                  # G2
  probe: linear                        # single-position multiclass — minutes, not hours
  anchor: mid_def
  controls: [within_base_shuffled_labels, surface_window_token_ids, hewitt_liang_control_task]
  min_margin_over_best_control: 0.05
  note: >
    A precondition, not a result: the value is a deterministic function of the
    visible text, so an executing baseline scores 1.0 and no floor here is
    pinned by construction.

stage85_store_transition:              # G3
  measures: [frozen_decoder_transfer_matrix, paired_transition_reversal]
  positive_control: head_value          # text-present, same anchors, same classifier
  min_transfer_retention: 0.60
  min_control_retention: 0.90           # if this fails the instrument is dead
  min_transition_reversal: 0.50

stage86_store_ceiling:                 # G4 — ceiling AND aliveness check
  variants: [whole_state, noop, irrelevant, pre_def]
  min_transformed_rate: 0.50
  structural_zeros: [noop, pre_def]     # nonzero => hooks/anchors/dtype are wrong

stage87_store_interchange:             # G5
  ranks: [1, 2, 4, 8]
  variants: [das, random_rank, random_norm, noop, irrelevant, pre_def, whole_state]
  alignment: {steps: 200, batch_size: 8, lr: 0.01, trained_on: calibration_split_only}
  min_fraction_of_ceiling: 0.50
  decisive_control: held_out_operation_family
  metric: transformed-rate, paired cluster bootstrap over base programs

stage88_store_report:                  # machine-readable gated report
  verdicts: [INSTRUMENT VALIDATED, INSTRUMENT NOT VALIDATED, INCOMPLETE]

store_pilot:                           # the cheap 1.3b instrument pilot
  model: deepseek-coder-1.3b
  n_bases: 120
  layers: [6, 12, 18]
  ranks: [1, 2, 4]

# ── E13: binding interchange, falsified by the value assignment ──────────────
# The active direction. Asks whether a low-rank, magnitude-free interchange at
# the binding-resolution site transports WHICH DEFINITION IS IN SCOPE rather
# than a token or an answer direction. Design: docs/METHODS.md §8.
#
# No arithmetic anywhere — the model returns a variable. That is the coupling
# E12 got wrong and this design removes.

stage100_binding_pairs:
  n_bases: 400
  calib_frac: 0.3                      # whole BASES move; both arms stay together
  template: global_shadow_no_operation  # E11's template with the operation removed
  invariants: [four_cells_share_token_length, one_token_mutation_per_arm,
               use_token_identical_everywhere, mutation_at_least_4_tokens_before_use,
               arms_crossed, values_distinct_single_tokens,
               answer_appends_one_token, no_arithmetic]

stage101_binding_verify:               # H0
  readings: [execution, scope_aware_reference_interpreter]
  scoping_rule: "a name assigned anywhere in a body is local for the whole body"
  min_verified_fraction: 0.999

stage102_binding_behaviour:            # H1
  metric: two-alternative forced choice between the two values
  min_overall_accuracy: 0.85
  min_cell_accuracy: 0.75              # per (arm, binding) — a mean can hide a dead cell

stage103_binding_extract:
  anchors: [def_source, def_target, mutation, use, answer]
  cells: [ab_source, ab_target, ba_source, ba_target]

stage104_binding_decode:               # H2
  label: which definition is in scope
  anchor: use
  controls: [measured_surface_window, within_base_shuffled_labels]
  min_accuracy: 0.80
  min_margin_over_surface: 0.10

stage105_binding_ceiling:              # H3
  variants: [whole_state, noop]
  per_arm: true                        # both arms must be measurable or H5 is mute
  min_flip_rate: 0.25
  structural_zeros: [noop, whole_state_at_def_source]

stage106_binding_interchange:          # H4, H5
  training_arm: ab
  held_out_arm: ba
  ranks: [1, 2, 4, 8]
  variants: [das_binding, answer_direction, random_rank, random_norm, noop, whole_state]
  alignment: {steps: 200, batch_size: 8, lr: 0.01, trained_on: calibration_split_and_training_arm_only}
  min_train_arm_fraction: 0.50         # H4, fraction of the ceiling
  min_transfer_fraction: 0.50          # H5, fraction of the HELD-OUT arm's ceiling
  decisive_control: answer_direction   # must pass `ab` and FAIL `ba`

stage107_binding_report:
  verdicts: [BINDING TRANSPORTED, NOT SUPPORTED, INCOMPLETE]

binding_pilot:
  model: deepseek-coder-1.3b
  n_bases: 200
  layers: [6, 12, 18]
  ranks: [1, 2, 4]

# ── E15: source → sensitive sink, audited through the E9 obfuscation ladder ──
# "Do code models see through obfuscation?" — is the value at a code-bearing,
# security-sensitive argument source-derived, and does a FROZEN linear readout
# of that fact survive renaming, opaque predicates, MBA encoding and control-flow
# flattening? Design: docs/METHODS.md §5.
#
# Stages 120-124 are hard-gated through the same registry as E12/E13
# (src/experiments/store_gates.py::SINKFLOW). Each refuses to run (exit 2)
# unless its prerequisite gates passed; `--override-gate REASON` is recorded
# permanently in results/sinkflow/{model}/gates.yaml and in the manifest.

stage120_sinkflow_generate:            # S0
  families: [command_exec, sql_exec, dynamic_exec]
  structures: [direct, assign_chain, branch_merge, helper]
  n_seeds: 20                          # base seeds per (family, structure)
  n_train_seeds: 14                    # the rest (6) are held out
  labels: [unsafe, safe]               # 3 x 4 x 20 x 2 = 480 clean programs
  sanitizers: none                     # html.escape -> exec is NOT a mitigation;
                                       # the safe member carries an independently
                                       # trusted literal instead
  obfuscation: {levels: [0, 1, 2, 3, 4], applied_to: heldout_only}
  ground_truth: [static_taint_fixpoint, instrumented_execution_under_stubs]
  invariants: [exact_program_count, cell_balance, no_split_leakage, programs_parse,
               anchors_token_exact, labels_independently_recovered,
               pair_differs_only_at_sink_argument, obfuscation_preserves_label,
               all_levels_present_for_every_heldout_base, heldout_only_obfuscated]

stage121_sinkflow_extract:             # S1 (the only GPU stage)
  shards: [train, heldout, heldout_obf]
  max_length: 1024
  dtype: float16
  layers: registry                     # must include -1 (the embedding control)
  gate: every program extracted, every anchor on a stored token boundary

stage122_sinkflow_probe:               # S2
  sites: [sink_arg, last_token]        # sink_arg is the headline; last_token is secondary
  label: is the value at the sensitive argument source-derived?
  probe: linear                        # grouped CV, folds split by BASE
  controls: [within_base_shuffled_labels, measured_surface_window, embedding_layer]
  surface_window: 3                    # +-3 token ids around the anchor, no hidden states
  trained_on: clean_training_bases_only # recorded in probes/provenance.json

stage123_sinkflow_obfuscation:         # S3
  conditions: [clean_heldout, obf0, obf1, obf2, obf3, obf4]
  probes: frozen_from_stage122         # never retrained on a variant
  surface_baseline: frozen_and_transferred
  report_by: [family, structure, obfuscation_level, model, layer]
  gate: expected row count, both classes in every reported cell, probe provenance
        disjoint from the evaluated bases

stage124_sinkflow_report:
  verdicts: [GATES PASS, INCOMPLETE]
  note: >
    A passing gate says the measurement works, not that anything is shown. E15
    stays `active` in results/STATUS.yaml until the gates pass on a real run.

sinkflow_pilot:                        # the cheap local smoke
  model: deepseek-coder-1.3b
  n_seeds: 4
  n_train_seeds: 3
  layers: [-1, 0, 11]

stage110_rlens_validate:               # E14 gate R — GATES stage 111
  n_r0: 5                              # programs for the forward-invariance check
  n_r2: 10                             # samples per (layer, ablation arm)
  n_sources: 40
  candidates: SAFE_NAMES               # only used to build a cotangent for R2
  ablations: [all, no_ln, no_identity, no_half, none]
  r0_rtol: {float32: 1.0e-4, float16: 1.0e-2}        # RELATIVE — logits run to ~80,
                                                     # where an absolute bound fails
                                                     # on float32 rounding alone
  max_early_abs_error: 0.10            # R2: median |rho-1| under LRP, layers <= mid
  required_checks: [R0_forward_invariance, R1_last_layer_equals_logit_lens,
                    R2_lrp_beats_autograd_everywhere, R2_lrp_conserves_in_early_layers]
